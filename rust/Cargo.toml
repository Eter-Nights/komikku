[package]
name = "rust_lib_komikku"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
flutter_rust_bridge = "=2.12.0"
# 错误处理
anyhow = "1"

# HTTP 客户端与中间件
reqwest = { version = "0.13.2", features = ["json", "cookies", "query", "form"] }
reqwest-middleware = { version = "0.5.2", features = ["query", "form"] }
reqwest-retry = "0.9.1"

# 序列化
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-aux = "4"
strum = { version = "0.28.0", features = ["derive"] }

# 加密与图片处理
aes = "0.9.2"
ecb = "0.2"
base64 = "0.23.1"
md5 = "0.8.0"
image = "0.25"
bytes = "1.11.1"

# 日志
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "local-time"] }

# 并发与异步
parking_lot = "0.12"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs", "sync"] }

# 缓存
moka = { version = "0.12", features = ["future"] }
sea-orm = { version = "2.0.2", default-features = false, features = ["sqlx-sqlite", "runtime-tokio", "macros", "entity-registry", "schema-sync"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
